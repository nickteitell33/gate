<!DOCTYPE html>
<html>
<head>
    <title>Entry</title>
    <style>
        body { 
            background: #F5F3ED; 
            display: flex; 
            height: 100vh; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            margin: 0; 
            font-family: sans-serif; 
            color: #000;
        }
        
        h1 { 
            font-weight: 300; 
            letter-spacing: 2px; 
            font-size: 14px; 
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0.7;
        }

        input { 
            padding: 12px; 
            border: 1px solid #000; 
            background: transparent; 
            text-align: center; 
            font-size: 18px; 
            outline: none; 
            width: 220px; 
            letter-spacing: 4px;
        }

        /* Styles the asterisk placeholder to be subtle */
        input::placeholder {
            color: #000;
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <h1>the door is locked</h1>
    
    <input type="password" id="gate" placeholder="****" autofocus>

    <script>
        const input = document.getElementById('gate');
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && input.value.length > 0) {
                // Change the link below to your Squarespace home page
                window.location.href = "https://nicholasteitell.wordpress.com/";
            }
        });
    </script>
</body>
</html>
